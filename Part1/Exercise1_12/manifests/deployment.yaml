apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: todo-app
          image: alejosan/todo-app:1.12
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: image-cache
              mountPath: /data
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-app-image-cache
