apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: alejosan/todo-app:v1.5
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
