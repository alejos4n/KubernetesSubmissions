apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output
          image: alejosan/log-output:2.1
          imagePullPolicy: Always
          env:
            - name: PINGPONG_URL
              value: http://ping-pong.exercises.svc.cluster.local/pings
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: alejosan/pingpong:2.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
